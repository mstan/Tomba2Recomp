schema = 1

[product]
name = "Tombi2Recomp-ita"
display_name = "Tombi! 2 (Italian) Recompiled"
exe_name = "Tombi2Recomp-ita"
version_file = "packaging/release/VERSION"
game_toml = "game_ita.toml"
player_game_toml = "packaging/release/game_ita.toml"
runtime_target = "psx-runtime-ita"
zip_folder = "Tombi2Recomp-ita-windows-x64"
launcher_boxart = "recomp/launcher/boxart.tga"

[build]
regenerate = true
pgo_train_frames = 600
cmake_args = [
  "-DPSX_EXECUTION_PROFILE=ENHANCED", "-DPSX_NATIVE_KERNEL=OFF", "-DPSX_PGXP_VARIANT=OFF",
  "-DPSX_SETUP_WIZARD=OFF", "-DPSX_NETPLAY=OFF",
  "-DPSX_MOD_DEVELOPER_CHANNEL=OFF", "-DTOMBA2_BUILD_USA_RUNTIME=OFF",
  "-DTOMBA2_ITA_PLAYER_CONFIG=game.toml"
]
windows_cmake_args = ["-DCMAKE_EXE_LINKER_FLAGS=-Wl,--no-insert-timestamp"]

[aot]
mode = "cache"
profile = "aot/ita.json"
cps = true

[overlay_toolchain]
ship = true

[diagnostics]
game_id = "SCES-02686"
package_id = "tomba2.diagnostics"
replay_helper = true

[payload]
start_here = "packaging/release/START_HERE_ITA.txt"
files = ["README.md", "LICENSE", "PERMISSIONS.md", "RELEASE_NOTES.md",
  {from = "packaging/release/input.ini", to = "input.ini"}]

[linux]
app_run = "psxrecomp-v4/tools/new_project_layout/templates/AppRun.in"
desktop_file = "packaging/linux/io.github.mstan.Tombi2RecompIta.desktop"
icon = "recomp/launcher/boxart.tga"
payload_dir = "tombi2recomp-ita"
env_prefix = "TOMBI2_RECOMP_ITA"
