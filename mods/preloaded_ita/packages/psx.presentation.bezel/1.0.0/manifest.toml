format_version = 5
id = "psx.presentation.bezel"
version = "1.0.0"
name = "Artwork cornice"
author = "psxrecomp"
description = "Disegna un'immagine scelta dall'utente dietro l'area di gioco nei margini letterbox o pillarbox OpenGL. Disattivato per impostazione predefinita; con la funzione spenta, i margini restano neri."
resolver = "declarative"
save_compatibility = "shared"

[[target]]
game_id = "*"

[[feature]]
id = "bezel"
name = "Artwork cornice"
description = "Disattivato per impostazione predefinita. Seleziona un file immagine da disegnare dietro il frame di gioco quando il rapporto schermo lascia margini laterali o superiore/inferiore. E solo presentazione e non cambia il rendering guest."
group = "Video"
default_enabled = false

[[resource]]
feature = "bezel"
id = "artwork"
label = "Immagine cornice"
description = "Seleziona un'immagine da disegnare dietro il frame di gioco nei margini letterbox o pillarbox."
format = "file"
file_patterns = "*.png,*.jpg,*.jpeg,*.bmp"
file_description = "File immagine"
required = false

[[plugin]]
feature = "bezel"
id = "psx.bezel"

