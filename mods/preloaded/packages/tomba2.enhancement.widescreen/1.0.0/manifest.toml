format_version = 5
id = "tomba2.enhancement.widescreen"
version = "1.0.0"
name = "Tomba 2 Widescreen"
author = "mstan"
description = "Renders Tomba 2 gameplay with a wider field of view using its game-specific projection, culling, backdrop, and object-participation hooks."
resolver = "declarative"
save_compatibility = "shared"

[[target]]
game_id = "SCUS-94454"
disc_sha256 = "8e9568388155787384c3166a5934a495fbff3fa57154ab0489b0f214fe05a8ab"

[[target]]
game_id = "SCUS-94454"
disc_sha256 = "56bb2164df4e49acce2560acca7ce90829bec0762f53a12ad8e2008ff0f6fada"

# Italian PAL release (Tombi! 2 - The Evil Swine Return, SCES-02686).
[[target]]
game_id = "SCES-02686"
disc_sha256 = "b9c8ff05f265f2ec359bc559b0731109de15c0a0d0d036b0da23ddbf98a19188"

[[feature]]
id = "widescreen"
name = "Widescreen (Experimental)"
description = "Enable Tomba 2's native-wide gameplay rendering and choose a fixed or resize-driven aspect."
group = "Display"
default_enabled = false

[[option]]
feature = "widescreen"
id = "aspect"
label = "Aspect ratio"
description = "Adaptive follows the live window size from 4:3 through 21:9."
group = "Display"
type = "choice"
default = "16:9"

[[option.choice]]
value = "16:9"
label = "16:9"

[[option.choice]]
value = "21:9"
label = "21:9"

[[option.choice]]
value = "adaptive"
label = "Adaptive"

[[plugin]]
feature = "widescreen"
id = "tomba2.widescreen.16-9"
when = { aspect = "16:9" }

[[plugin]]
feature = "widescreen"
id = "tomba2.widescreen.21-9"
when = { aspect = "21:9" }

[[plugin]]
feature = "widescreen"
id = "tomba2.widescreen.adaptive"
when = { aspect = "adaptive" }
