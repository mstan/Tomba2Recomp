format_version = 5
id = "tomba2.diagnostics"
version = "1.0.0"
name = "Diagnostics"
author = "psxrecomp"
description = "Record controller inputs and session diagnostics to help reproduce issues."
resolver = "declarative"
save_compatibility = "shared"

[[target]]
game_id = "SCUS-94454"

[[feature]]
id = "recording"
name = "Record input diagnostics"
description = "Save inputs and diagnostic session data in a private folder. Your saved choice is remembered for future sessions."
group = "Diagnostics"
default_enabled = true
hidden = false
quick = false

[[feature]]
id = "osd"
name = "Show input diagnostics"
description = "Show the optional input display during play."
group = "Diagnostics"
default_enabled = false
hidden = false
quick = false

[[plugin]]
feature = "recording"
id = "tomba2.diagnostics"

[[plugin]]
feature = "osd"
id = "tomba2.diagnostics.osd"
