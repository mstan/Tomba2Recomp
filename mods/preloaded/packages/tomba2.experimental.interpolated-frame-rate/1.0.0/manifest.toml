format_version = 5
id = "tomba2.experimental.interpolated-frame-rate"
version = "1.0.0"
name = "Tomba 2 Native Scene Interpolation"
author = "mstan"
description = "Redraw intermediate 3D scenes while game logic, timers, input, and audio keep their original cadence."
resolver = "declarative"
save_compatibility = "shared"

[[target]]
game_id = "SCUS-94454"
disc_sha256 = "8e9568388155787384c3166a5934a495fbff3fa57154ab0489b0f214fe05a8ab"

[[feature]]
id = "interpolated-frame-rate"
name = "Native Scene Interpolation"
description = "Rebuild scene geometry at intermediate positions, preserving HUD and effects at their authored cadence."
group = "Frame Rate"
default_enabled = false

[[option]]
feature = "interpolated-frame-rate"
id = "rate"
label = "Presentation rate"
description = "Display refresh is recommended for even cadence. Requires OpenGL."
group = "Frame Rate"
type = "choice"
default = "display"

[[option.choice]]
value = "display"
label = "Display refresh (Recommended)"

[[option.choice]]
value = "60"
label = "60 FPS"

[[option.choice]]
value = "90"
label = "90 FPS"

[[option.choice]]
value = "120"
label = "120 FPS"

[[option.choice]]
value = "144"
label = "144 FPS"

[[option.choice]]
value = "165"
label = "165 FPS"

[[option.choice]]
value = "240"
label = "240 FPS"

[[plugin]]
feature = "interpolated-frame-rate"
id = "tomba2.framerate.display"
when = { rate = "display" }

[[plugin]]
feature = "interpolated-frame-rate"
id = "tomba2.framerate.60"
when = { rate = "60" }

[[plugin]]
feature = "interpolated-frame-rate"
id = "tomba2.framerate.90"
when = { rate = "90" }

[[plugin]]
feature = "interpolated-frame-rate"
id = "tomba2.framerate.120"
when = { rate = "120" }

[[plugin]]
feature = "interpolated-frame-rate"
id = "tomba2.framerate.144"
when = { rate = "144" }

[[plugin]]
feature = "interpolated-frame-rate"
id = "tomba2.framerate.165"
when = { rate = "165" }

[[plugin]]
feature = "interpolated-frame-rate"
id = "tomba2.framerate.240"
when = { rate = "240" }
