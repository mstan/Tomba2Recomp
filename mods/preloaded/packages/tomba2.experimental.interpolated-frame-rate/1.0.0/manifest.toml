format_version = 5
id = "tomba2.experimental.interpolated-frame-rate"
version = "1.0.0"
name = "Tomba 2 Frame Blending"
author = "mstan"
description = "Presentation-only temporal frame blending. Game logic, timers, input, and audio remain at their stock cadence."
resolver = "declarative"
save_compatibility = "shared"

[[target]]
game_id = "SCUS-94454"
disc_sha256 = "8e9568388155787384c3166a5934a495fbff3fa57154ab0489b0f214fe05a8ab"

[[feature]]
id = "interpolated-frame-rate"
name = "Temporal Frame Blending (Experimental)"
description = "Blend completed display images at the selected presentation rate without accelerating gameplay, timers, input, or audio. This is not motion-vector frame generation."
group = "Frame Rate"
default_enabled = false

[[option]]
feature = "interpolated-frame-rate"
id = "rate"
label = "Presentation rate"
description = "Follow the display for even cadence, or choose a fixed diagnostic rate. The original game simulation remains untouched. Requires OpenGL."
group = "Frame Rate"
type = "choice"
default = "uncapped"

[[option.choice]]
value = "60"
label = "60 FPS"

[[option.choice]]
value = "120"
label = "120 FPS"

[[option.choice]]
value = "144"
label = "144 FPS"

[[option.choice]]
value = "165"
label = "165 FPS"

[[option.choice]]
value = "uncapped"
label = "Display refresh (Recommended)"

[[plugin]]
feature = "interpolated-frame-rate"
id = "tomba2.framerate.60"
when = { rate = "60" }

[[plugin]]
feature = "interpolated-frame-rate"
id = "tomba2.framerate.120"
when = { rate = "120" }

[[plugin]]
feature = "interpolated-frame-rate"
id = "tomba2.framerate.144"
when = { rate = "144" }

[[plugin]]
feature = "interpolated-frame-rate"
id = "tomba2.framerate.165"
when = { rate = "165" }

[[plugin]]
feature = "interpolated-frame-rate"
id = "tomba2.framerate.uncapped"
when = { rate = "uncapped" }
