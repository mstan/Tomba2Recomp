format_version = 5
id = "tomba2.experimental.interpolated-frame-rate"
version = "1.0.0"
name = "Tomba 2 Frame Blending"
author = "mstan"
description = "Presentation-only temporal frame blending. Game logic, timers, input, and audio remain at their stock cadence."
resolver = "declarative"
save_compatibility = "shared"

[[target]]
game_id = "SCUS-94454"
disc_sha256 = "8e9568388155787384c3166a5934a495fbff3fa57154ab0489b0f214fe05a8ab"

# Italian PAL release (Tombi! 2 - The Evil Swine Return, SCES-02686).
[[target]]
game_id = "SCES-02686"
disc_sha256 = "b9c8ff05f265f2ec359bc559b0731109de15c0a0d0d036b0da23ddbf98a19188"

[[feature]]
id = "interpolated-frame-rate"
name = "Temporal Frame Blending (Experimental)"
description = "Blend completed display images at the selected presentation rate without accelerating gameplay, timers, input, or audio. This is not motion-vector frame generation."
group = "Frame Rate"
default_enabled = false

[[option]]
feature = "interpolated-frame-rate"
id = "rate"
label = "Presentation rate"
description = "Display refresh is recommended for even cadence. Motion-adaptive clarity reduces double-image trails. Requires OpenGL."
group = "Frame Rate"
type = "choice"
default = "display"

[[option.choice]]
value = "display"
label = "Display refresh (Recommended)"

[[option.choice]]
value = "60"
label = "60 FPS"

[[option.choice]]
value = "90"
label = "90 FPS"

[[option.choice]]
value = "120"
label = "120 FPS"

[[option.choice]]
value = "144"
label = "144 FPS"

[[option.choice]]
value = "165"
label = "165 FPS"

[[option.choice]]
value = "240"
label = "240 FPS"

[[plugin]]
feature = "interpolated-frame-rate"
id = "tomba2.framerate.display"
when = { rate = "display" }

[[plugin]]
feature = "interpolated-frame-rate"
id = "tomba2.framerate.60"
when = { rate = "60" }

[[plugin]]
feature = "interpolated-frame-rate"
id = "tomba2.framerate.90"
when = { rate = "90" }

[[plugin]]
feature = "interpolated-frame-rate"
id = "tomba2.framerate.120"
when = { rate = "120" }

[[plugin]]
feature = "interpolated-frame-rate"
id = "tomba2.framerate.144"
when = { rate = "144" }

[[plugin]]
feature = "interpolated-frame-rate"
id = "tomba2.framerate.165"
when = { rate = "165" }

[[plugin]]
feature = "interpolated-frame-rate"
id = "tomba2.framerate.240"
when = { rate = "240" }
